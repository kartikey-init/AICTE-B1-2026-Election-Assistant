<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Sarthi: Election Assistant</title>
    
    <style nonce="{{ csp_nonce }}">

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  --saffron:   #FF9933;
  --saffron-dk:#e8851a;
  --green:     #138808;
  --navy:      #000080;
  --navy-lt:   #1a2a6c;
  --white:     #ffffff;
  --bg-from:   #fef3e2;
  --bg-to:     #e8f5e9;
  --surface:   rgba(255,255,255,0.92);
  --user-bg:   linear-gradient(135deg,#FF9933,#e8851a);
  --bot-bg:    #ffffff;
  --text:      #1a1a2e;
  --muted:     #7c8ba1;
  --border:    rgba(0,0,0,0.07);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-md: 0 8px 32px rgba(0,0,0,0.10);
  --shadow-lg: 0 20px 60px rgba(0,0,0,0.14);
  --radius:    18px;
  --radius-sm: 10px;
}

/* ---- RESET ---- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', sans-serif;
  background: linear-gradient(145deg, var(--bg-from) 0%, #fff 45%, var(--bg-to) 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* ---- BACKGROUND DECO ---- */
body::before, body::after {
  content: '';
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
}
body::before {
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(255,153,51,0.12) 0%, transparent 70%);
  top: -120px; left: -120px;
}
body::after {
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(19,136,8,0.10) 0%, transparent 70%);
  bottom: -100px; right: -100px;
}

/* ---- OUTER WRAPPER ---- */
.app-wrapper {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 720px;
  height: 94vh;
  max-height: 940px;
  display: flex;
  flex-direction: column;
}

/* ---- CHAT CARD ---- */
.chat-container {
  flex: 1;
  background: var(--surface);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 28px;
  box-shadow: var(--shadow-lg);
  border: 1px solid rgba(255,255,255,0.6);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ---- HEADER ---- */
.chat-header {
  background: linear-gradient(135deg, var(--navy-lt) 0%, var(--navy) 100%);
  padding: 18px 20px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  position: relative;
  flex-shrink: 0;
}
.chat-header::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--saffron), var(--white) 50%, var(--green));
}

.avatar-wrap {
  position: relative;
  flex-shrink: 0;
}
.avatar {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--saffron), var(--green));
  color: #fff;
  font-size: 22px;
  font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 12px rgba(255,153,51,0.35);
  border: 2px solid rgba(255,255,255,0.25);
}
.online-dot {
  position: absolute;
  bottom: 2px; right: 2px;
  width: 11px; height: 11px;
  background: #4CAF50;
  border-radius: 50%;
  border: 2px solid var(--navy);
  animation: pulse-dot 2s infinite;
}
@keyframes pulse-dot {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}

.header-info { flex: 1; }
.header-info h1 {
  font-size: 17px; font-weight: 700;
  color: #fff;
  letter-spacing: 0.3px;
}
.header-info .subtitle {
  font-size: 12px; color: rgba(255,255,255,0.65);
  margin-top: 2px;
  display: flex; align-items: center; gap: 4px;
}
.status-text { color: #4CAF50; font-weight: 500; }

.header-actions { display: flex; gap: 6px; }
.icon-btn {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.8);
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
}
.icon-btn:hover {
  background: rgba(255,255,255,0.22);
  color: #fff;
  transform: scale(1.05);
}
.icon-btn svg { width: 16px; height: 16px; }

/* ---- ECI BANNER ---- */
.eci-banner {
  background: linear-gradient(90deg, rgba(255,153,51,0.08), rgba(19,136,8,0.08));
  border-bottom: 1px solid var(--border);
  padding: 7px 16px;
  display: flex; align-items: center; gap: 6px;
  flex-shrink: 0;
}
.eci-banner span {
  font-size: 11px; color: var(--muted); font-weight: 500;
}
.eci-banner a {
  font-size: 11px; color: var(--saffron);
  text-decoration: none; font-weight: 600;
}
.eci-banner a:hover { text-decoration: underline; }

/* ---- MESSAGES AREA ---- */
.chat-messages {
  flex: 1;
  padding: 26px 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
  scroll-behavior: smooth;
}
.chat-messages::-webkit-scrollbar { width: 5px; }
.chat-messages::-webkit-scrollbar-track { background: transparent; }
.chat-messages::-webkit-scrollbar-thumb {
  background: rgba(0,0,0,0.1); border-radius: 10px;
}

/* ---- MESSAGE GROUPS ---- */
.msg-group { display: flex; flex-direction: column; gap: 4px; }
.msg-group.bot  { align-items: flex-start; }
.msg-group.user { align-items: flex-end; }

.msg-row {
  display: flex; align-items: flex-end; gap: 8px;
}
.msg-group.user .msg-row { flex-direction: row-reverse; }

/* mini avatar in message area */
.msg-avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--saffron), var(--green));
  color: #fff; font-size: 13px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 2px 6px rgba(255,153,51,0.3);
}

/* ---- BUBBLE ---- */
.message {
  max-width: 85%;
  padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 15px;
  line-height: 1.6;
  animation: slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
  word-break: break-word;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(14px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0)  scale(1); }
}

.msg-group.bot .message {
  background: var(--bot-bg);
  color: var(--text);
  border-bottom-left-radius: 5px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
}
.msg-group.user .message {
  background: var(--user-bg);
  color: #fff;
  border-bottom-right-radius: 5px;
  box-shadow: 0 4px 12px rgba(255,153,51,0.22);
}

.message strong { font-weight: 700; }
.message ul { margin: 8px 0 0 18px; }
.message ul li { margin-bottom: 3px; }
.msg-link { color: var(--saffron); font-weight: 600; text-decoration: underline; }
.msg-group.user .message .msg-link { color: #fff; }

/* timestamps */
.msg-time {
  font-size: 10px; color: var(--muted);
  padding: 0 4px; margin-top: 1px;
}

/* ---- TYPING INDICATOR ---- */
.typing-wrap { display: flex; align-items: flex-end; gap: 8px; }
.typing-indicator {
  display: flex; gap: 5px;
  padding: 12px 16px;
  background: var(--bot-bg);
  border-radius: var(--radius);
  border-bottom-left-radius: 5px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  width: fit-content;
  animation: slideUp 0.3s ease both;
}
.typing-indicator span {
  width: 7px; height: 7px;
  background: #c0cada;
  border-radius: 50%;
  animation: bounce 1.1s infinite;
}
.typing-indicator span:nth-child(2) { animation-delay: 0.18s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.36s; }
@keyframes bounce {
  0%,100% { transform: translateY(0); background: #c0cada; }
  50%      { transform: translateY(-6px); background: var(--saffron); }
}

/* ---- QUICK REPLIES ---- */
.quick-replies {
  padding: 4px 16px 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  min-height: 10px;
}

.quick-reply-btn {
  background: #fff;
  border: 1.5px solid rgba(255,153,51,0.35);
  color: var(--navy);
  padding: 8px 15px;
  border-radius: 22px;
  font-size: 13.5px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: all 0.18s ease;
  box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  animation: slideUp 0.3s ease both;
}
.quick-reply-btn:hover {
  background: var(--saffron);
  color: #fff;
  border-color: var(--saffron);
  transform: translateY(-2px);
  box-shadow: 0 6px 14px rgba(255,153,51,0.3);
}

/* ---- INPUT AREA ---- */
.chat-input-container {
  padding: 14px 18px 18px;
  background: rgba(255,255,255,0.95);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
#chat-form { display: flex; gap: 12px; align-items: center; }

#chat-input {
  flex: 1;
  padding: 14px 18px;
  border: 1.5px solid rgba(0,0,0,0.08);
  border-radius: 26px;
  font-size: 15px;
  font-family: 'Inter', sans-serif;
  outline: none;
  background: #f6f7fb;
  color: var(--text);
}
#chat-input:focus {
  border-color: var(--saffron);
  background: #fff;
  box-shadow: 0 0 0 4px rgba(255,153,51,0.10);
}

#send-btn {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--saffron), var(--saffron-dk));
  border: none; color: #fff;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
  transition: all 0.2s;
}
#send-btn svg { width: 20px; height: 20px; }
#send-btn:hover { transform: scale(1.07); box-shadow: 0 6px 18px rgba(255,153,51,0.45); }
#send-btn:disabled { cursor: wait; opacity: 0.6; transform: none; box-shadow: none; }

.mic-btn { background: var(--saffron); color: #fff; }
.message-error { color: #b71c1c; background: #ffebee; border-color: #ffcdd2; }
.sources { margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 11px; }
.sources ul { list-style: none; padding: 0; margin: 6px 0 0; }
.sources li { margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sources a { font-size: 11px; }

button:focus-visible, a:focus-visible, input:focus-visible {
  outline: 3px solid rgba(26,42,108,0.55);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; scroll-behavior: auto !important; }
}

/* ---- FOOTER ---- */
.chat-footer {
  text-align: center;
  padding: 8px 0 0;
  font-size: 11px;
  color: var(--muted);
}
.chat-footer a { color: var(--saffron); text-decoration: none; font-weight: 600; }

/* ---- RESPONSIVE ---- */
@media (max-width: 500px) {
  body { align-items: flex-end; }
  .app-wrapper { max-width: 100%; height: 100vh; max-height: 100vh; }
  .chat-container { border-radius: 20px 20px 0 0; }
}
    </style>
</head>
<body>
    <div class="app-wrapper">
        <div class="chat-container">
            <header class="chat-header">
                <div class="avatar-wrap">
                    <div class="avatar">K</div>
                    <div class="online-dot"></div>
                </div>
                
                <div class="header-info">
                    <h1>Kartikey</h1>
                    <div class="subtitle">
                        <span class="status-text">Online</span> • India Election Expert
                    </div>
                </div>
                <div class="header-actions">
                    <button type="button" id="clear-chat-btn" class="icon-btn" title="Restart Chat" aria-label="Restart chat">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                    </button>
                </div>
            </header>

            <div class="eci-banner">
                <span>Source: Election Commission of India</span>
                <a href="https://eci.gov.in" target="_blank" rel="noopener noreferrer">Visit Official ECI</a>
            </div>

            <div id="chat-messages" class="chat-messages" role="log" aria-live="polite" aria-relevant="additions"></div>

            <div class="quick-replies" id="quick-replies">
                <button type="button" class="quick-reply-btn" data-message="When are the next elections?">Next Election?</button>
                <button type="button" class="quick-reply-btn" data-message="How do I register to vote?">How to Vote?</button>
                <button type="button" class="quick-reply-btn" data-message="Check my constituency">Constituency</button>
            </div>

            <div class="chat-input-container">
                <form id="chat-form">
                    <button type="button" id="mic-btn" class="icon-btn mic-btn" aria-label="Use microphone" title="Use microphone">🎙️</button>
                    <input type="text" id="chat-input" placeholder="Ask about elections..." autocomplete="off" maxlength="2000" aria-label="Your message">
                    <button type="submit" id="send-btn" aria-label="Send message">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </form>
                <footer class="chat-footer">
                    Data is for informational purposes • <a href="https://voters.eci.gov.in/" target="_blank" rel="noopener noreferrer">Voter Portal</a>
                </footer>
            </div>
        </div>
    </div>

    <script nonce="{{ csp_nonce }}">
const chatForm = document.getElementById('chat-form');
const chatInput = document.getElementById('chat-input');
const chatMessages = document.getElementById('chat-messages');
const sendButton = document.getElementById('send-btn');
const micButton = document.getElementById('mic-btn');
let isSending = false;
let availableVoices = [];

chatForm.addEventListener('submit', (event) => {
    event.preventDefault();
    sendMessage();
});

document.getElementById('clear-chat-btn').addEventListener('click', clearChat);
document.querySelectorAll('.quick-reply-btn').forEach((button) => {
    button.addEventListener('click', () => {
        chatInput.value = button.dataset.message || '';
        sendMessage();
    });
});

function loadVoices() {
    if ('speechSynthesis' in window) {
        availableVoices = window.speechSynthesis.getVoices();
    }
}

if ('speechSynthesis' in window) {
    window.speechSynthesis.addEventListener('voiceschanged', loadVoices);
    loadVoices();
}

function speakKartikey(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text.replace(/[*#]/g, ''));
    const preferredVoices = [
        'Microsoft David', 'Google US English Male', 'Alex',
        'Google UK English Male', 'Microsoft Mark'
    ];
    const voice = preferredVoices
        .map((name) => availableVoices.find((item) => item.name.includes(name)))
        .find(Boolean);
    if (voice) utterance.voice = voice;
    utterance.lang = 'en-IN';
    utterance.rate = 1;
    utterance.pitch = 0.9;
    window.speechSynthesis.speak(utterance);
}

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
    const recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.lang = 'en-IN';
    recognition.interimResults = false;
    let isListening = false;

    micButton.addEventListener('click', () => {
        if (isListening) {
            recognition.stop();
            return;
        }
        try {
            recognition.start();
        } catch (error) {
            console.warn('Microphone could not be started:', error);
        }
    });

    recognition.onstart = () => {
        isListening = true;
        micButton.textContent = '🔴';
        micButton.setAttribute('aria-label', 'Stop microphone');
        chatInput.placeholder = 'Listening...';
    };
    recognition.onresult = (event) => {
        chatInput.value = event.results[0][0].transcript.slice(0, 2000);
        sendMessage();
    };
    recognition.onerror = (event) => {
        console.warn('Microphone error:', event.error);
    };
    recognition.onend = () => {
        isListening = false;
        micButton.textContent = '🎙️';
        micButton.setAttribute('aria-label', 'Use microphone');
        chatInput.placeholder = 'Ask about elections...';
    };
} else {
    micButton.hidden = true;
}

function createMessageElement(isUser, content) {
    const group = document.createElement('div');
    group.className = `msg-group ${isUser ? 'user' : 'bot'}`;

    const row = document.createElement('div');
    row.className = 'msg-row';
    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = isUser ? 'Y' : 'K';
    row.appendChild(avatar);

    const message = document.createElement('div');
    message.className = 'message';
    message.textContent = content;
    row.appendChild(message);

    const time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = new Date().toLocaleTimeString([], {
        hour: '2-digit',
        minute: '2-digit'
    });
    row.appendChild(time);
    group.appendChild(row);
    return group;
}

function appendFormattedText(element, text) {
    text.split(/(\*\*[^*\n]+\*\*)/g).forEach((part) => {
        if (part.startsWith('**') && part.endsWith('**')) {
            const strong = document.createElement('strong');
            strong.textContent = part.slice(2, -2);
            element.appendChild(strong);
            return;
        }
        part.split('\n').forEach((line, index) => {
            if (index > 0) element.appendChild(document.createElement('br'));
            element.appendChild(document.createTextNode(line));
        });
    });
}

function appendSources(message, chunks) {
    const sources = [];
    (Array.isArray(chunks) ? chunks : []).forEach((chunk) => {
        const web = chunk && chunk.web;
        if (!web || typeof web.uri !== 'string' || typeof web.title !== 'string') return;
        try {
            const url = new URL(web.uri);
            if (url.protocol === 'https:' || url.protocol === 'http:') {
                sources.push({ url: url.href, title: web.title });
            }
        } catch (_error) {
            return;
        }
    });
    if (!sources.length) return;

    const section = document.createElement('div');
    section.className = 'sources';
    const heading = document.createElement('strong');
    heading.textContent = 'Verified Sources:';
    section.appendChild(heading);
    const list = document.createElement('ul');
    sources.slice(0, 5).forEach((source) => {
        const item = document.createElement('li');
        const link = document.createElement('a');
        link.className = 'msg-link';
        link.href = source.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = source.title;
        item.appendChild(link);
        list.appendChild(item);
    });
    section.appendChild(list);
    message.appendChild(section);
}

function showError(message) {
    const error = createMessageElement(false, message);
    error.querySelector('.message').classList.add('message-error');
    chatMessages.appendChild(error);
}

async function clearChat() {
    const clearButton = document.getElementById('clear-chat-btn');
    clearButton.disabled = true;
    try {
        const response = await fetch('/api/chat/reset', { method: 'POST' });
        if (!response.ok) throw new Error('Unable to clear the conversation.');
        chatMessages.replaceChildren();
    } catch (error) {
        showError(error.message);
    } finally {
        clearButton.disabled = false;
    }
}

async function sendMessage() {
    const userText = chatInput.value.trim();
    if (!userText || isSending) return;

    isSending = true;
    sendButton.disabled = true;
    chatMessages.appendChild(createMessageElement(true, userText));
    chatInput.value = '';

    const loadingGroup = document.createElement('div');
    loadingGroup.className = 'msg-group bot';
    const typingIndicator = document.createElement('div');
    typingIndicator.className = 'typing-indicator';
    for (let index = 0; index < 3; index += 1) {
        typingIndicator.appendChild(document.createElement('span'));
    }
    loadingGroup.appendChild(typingIndicator);
    chatMessages.appendChild(loadingGroup);
    chatMessages.scrollTop = chatMessages.scrollHeight;

    try {
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: userText })
        });
        const data = await response.json();
        if (!response.ok) {
            throw new Error(data.error || 'The chat request failed. Please try again.');
        }

        const candidate = data.candidates && data.candidates[0];
        const parts = candidate && candidate.content && candidate.content.parts;
        const aiReply = Array.isArray(parts) && parts[0] && parts[0].text;
        if (typeof aiReply !== 'string' || !aiReply.trim()) {
            throw new Error('The chat service returned an empty response.');
        }

        const botGroup = createMessageElement(false, '');
        const message = botGroup.querySelector('.message');
        appendFormattedText(message, aiReply.trim());
        appendSources(
            message,
            candidate.groundingMetadata && candidate.groundingMetadata.groundingChunks
        );
        loadingGroup.remove();
        chatMessages.appendChild(botGroup);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        speakKartikey(aiReply);
    } catch (error) {
        console.error('Chat request failed:', error);
        loadingGroup.remove();
        showError(error.message || 'Unable to connect. Please try again.');
    } finally {
        isSending = false;
        sendButton.disabled = false;
        chatInput.focus();
    }
}
    </script>
</body>
</html>
