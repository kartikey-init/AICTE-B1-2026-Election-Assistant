<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartikey: Election Assistant</title>
    
    <style>
/* =====================================================
   KARTIKEY – ELECTION ASSISTANT | Professional Theme
   ===================================================== */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  --saffron:   #FF9933;
  --saffron-dk:#e8851a;
  --green:     #138808;
  --navy:      #000080;
  --navy-lt:   #1a2a6c;
  --white:     #ffffff;
  --bg-from:   #fef3e2;
  --bg-to:     #e8f5e9;
  --surface:   rgba(255,255,255,0.92);
  --user-bg:   linear-gradient(135deg,#FF9933,#e8851a);
  --bot-bg:    #ffffff;
  --text:      #1a1a2e;
  --muted:     #7c8ba1;
  --border:    rgba(0,0,0,0.07);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-md: 0 8px 32px rgba(0,0,0,0.10);
  --shadow-lg: 0 20px 60px rgba(0,0,0,0.14);
  --radius:    18px;
  --radius-sm: 10px;
}

/* ---- RESET ---- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', sans-serif;
  background: linear-gradient(145deg, var(--bg-from) 0%, #fff 45%, var(--bg-to) 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* ---- BACKGROUND DECO ---- */
body::before, body::after {
  content: '';
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
}
body::before {
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(255,153,51,0.12) 0%, transparent 70%);
  top: -120px; left: -120px;
}
body::after {
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(19,136,8,0.10) 0%, transparent 70%);
  bottom: -100px; right: -100px;
}

/* ---- OUTER WRAPPER ---- */
.app-wrapper {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 720px;
  height: 94vh;
  max-height: 940px;
  display: flex;
  flex-direction: column;
}

/* ---- CHAT CARD ---- */
.chat-container {
  flex: 1;
  background: var(--surface);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 28px;
  box-shadow: var(--shadow-lg);
  border: 1px solid rgba(255,255,255,0.6);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ---- HEADER ---- */
.chat-header {
  background: linear-gradient(135deg, var(--navy-lt) 0%, var(--navy) 100%);
  padding: 18px 20px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  position: relative;
  flex-shrink: 0;
}
.chat-header::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--saffron), var(--white) 50%, var(--green));
}

.avatar-wrap {
  position: relative;
  flex-shrink: 0;
}
.avatar {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--saffron), var(--green));
  color: #fff;
  font-size: 22px;
  font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 12px rgba(255,153,51,0.35);
  border: 2px solid rgba(255,255,255,0.25);
}
.online-dot {
  position: absolute;
  bottom: 2px; right: 2px;
  width: 11px; height: 11px;
  background: #4CAF50;
  border-radius: 50%;
  border: 2px solid var(--navy);
  animation: pulse-dot 2s infinite;
}
@keyframes pulse-dot {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}

.header-info { flex: 1; }
.header-info h1 {
  font-size: 17px; font-weight: 700;
  color: #fff;
  letter-spacing: 0.3px;
}
.header-info .subtitle {
  font-size: 12px; color: rgba(255,255,255,0.65);
  margin-top: 2px;
  display: flex; align-items: center; gap: 4px;
}
.status-text { color: #4CAF50; font-weight: 500; }

.header-actions { display: flex; gap: 6px; }
.icon-btn {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.8);
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
}
.icon-btn:hover {
  background: rgba(255,255,255,0.22);
  color: #fff;
  transform: scale(1.05);
}
.icon-btn svg { width: 16px; height: 16px; }

/* ---- ECI BANNER ---- */
.eci-banner {
  background: linear-gradient(90deg, rgba(255,153,51,0.08), rgba(19,136,8,0.08));
  border-bottom: 1px solid var(--border);
  padding: 7px 16px;
  display: flex; align-items: center; gap: 6px;
  flex-shrink: 0;
}
.eci-banner span {
  font-size: 11px; color: var(--muted); font-weight: 500;
}
.eci-banner a {
  font-size: 11px; color: var(--saffron);
  text-decoration: none; font-weight: 600;
}
.eci-banner a:hover { text-decoration: underline; }

/* ---- MESSAGES AREA ---- */
.chat-messages {
  flex: 1;
  padding: 26px 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
  scroll-behavior: smooth;
}
.chat-messages::-webkit-scrollbar { width: 5px; }
.chat-messages::-webkit-scrollbar-track { background: transparent; }
.chat-messages::-webkit-scrollbar-thumb {
  background: rgba(0,0,0,0.1); border-radius: 10px;
}

/* ---- MESSAGE GROUPS ---- */
.msg-group { display: flex; flex-direction: column; gap: 4px; }
.msg-group.bot  { align-items: flex-start; }
.msg-group.user { align-items: flex-end; }

.msg-row {
  display: flex; align-items: flex-end; gap: 8px;
}
.msg-group.user .msg-row { flex-direction: row-reverse; }

/* mini avatar in message area */
.msg-avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--saffron), var(--green));
  color: #fff; font-size: 13px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 2px 6px rgba(255,153,51,0.3);
}

/* ---- BUBBLE ---- */
.message {
  max-width: 85%;
  padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 15px;
  line-height: 1.6;
  animation: slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
  word-break: break-word;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(14px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0)  scale(1); }
}

.msg-group.bot .message {
  background: var(--bot-bg);
  color: var(--text);
  border-bottom-left-radius: 5px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
}
.msg-group.user .message {
  background: var(--user-bg);
  color: #fff;
  border-bottom-right-radius: 5px;
  box-shadow: 0 4px 12px rgba(255,153,51,0.22);
}

.message strong { font-weight: 700; }
.message ul { margin: 8px 0 0 18px; }
.message ul li { margin-bottom: 3px; }
.msg-link { color: var(--saffron); font-weight: 600; text-decoration: underline; }
.msg-group.user .message .msg-link { color: #fff; }

/* timestamps */
.msg-time {
  font-size: 10px; color: var(--muted);
  padding: 0 4px; margin-top: 1px;
}

/* ---- TYPING INDICATOR ---- */
.typing-wrap { display: flex; align-items: flex-end; gap: 8px; }
.typing-indicator {
  display: flex; gap: 5px;
  padding: 12px 16px;
  background: var(--bot-bg);
  border-radius: var(--radius);
  border-bottom-left-radius: 5px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  width: fit-content;
  animation: slideUp 0.3s ease both;
}
.typing-indicator span {
  width: 7px; height: 7px;
  background: #c0cada;
  border-radius: 50%;
  animation: bounce 1.1s infinite;
}
.typing-indicator span:nth-child(2) { animation-delay: 0.18s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.36s; }
@keyframes bounce {
  0%,100% { transform: translateY(0); background: #c0cada; }
  50%      { transform: translateY(-6px); background: var(--saffron); }
}

/* ---- QUICK REPLIES ---- */
.quick-replies {
  padding: 4px 16px 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  min-height: 10px;
}

.quick-reply-btn {
  background: #fff;
  border: 1.5px solid rgba(255,153,51,0.35);
  color: var(--navy);
  padding: 8px 15px;
  border-radius: 22px;
  font-size: 13.5px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: all 0.18s ease;
  box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  animation: slideUp 0.3s ease both;
}
.quick-reply-btn:hover {
  background: var(--saffron);
  color: #fff;
  border-color: var(--saffron);
  transform: translateY(-2px);
  box-shadow: 0 6px 14px rgba(255,153,51,0.3);
}

/* ---- INPUT AREA ---- */
.chat-input-container {
  padding: 14px 18px 18px;
  background: rgba(255,255,255,0.95);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
#chat-form { display: flex; gap: 12px; align-items: center; }

#chat-input {
  flex: 1;
  padding: 14px 18px;
  border: 1.5px solid rgba(0,0,0,0.08);
  border-radius: 26px;
  font-size: 15px;
  font-family: 'Inter', sans-serif;
  outline: none;
  background: #f6f7fb;
  color: var(--text);
}
#chat-input:focus {
  border-color: var(--saffron);
  background: #fff;
  box-shadow: 0 0 0 4px rgba(255,153,51,0.10);
}

#send-btn {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--saffron), var(--saffron-dk));
  border: none; color: #fff;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
  transition: all 0.2s;
}
#send-btn svg { width: 20px; height: 20px; }
#send-btn:hover { transform: scale(1.07); box-shadow: 0 6px 18px rgba(255,153,51,0.45); }

/* ---- FOOTER ---- */
.chat-footer {
  text-align: center;
  padding: 8px 0 0;
  font-size: 11px;
  color: var(--muted);
}
.chat-footer a { color: var(--saffron); text-decoration: none; font-weight: 600; }

/* ---- RESPONSIVE ---- */
@media (max-width: 500px) {
  body { align-items: flex-end; }
  .app-wrapper { max-width: 100%; height: 100vh; max-height: 100vh; }
  .chat-container { border-radius: 20px 20px 0 0; }
}
    </style>
</head>
<body>
    <div class="app-wrapper">
        <div class="chat-container">
            <header class="chat-header">
                <div class="avatar-wrap">
                    <div class="avatar">K</div>
                    <div class="online-dot"></div>
                </div>
                
                <div class="header-info">
                    <h1>Kartikey</h1>
                    <div class="subtitle">
                        <span class="status-text">Online</span> • India Election Expert
                    </div>
                </div>
                <div class="header-actions">
                    <button type="button" class="icon-btn" onclick="clearChat()" title="Restart Chat">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                    </button>
                </div>
            </header>

            <div class="eci-banner">
                <span>Source: Election Commission of India</span>
                <a href="https://eci.gov.in" target="_blank">Visit Official ECI</a>
            </div>

            <div id="chat-messages" class="chat-messages"></div>

            <div class="quick-replies" id="quick-replies">
                <button class="quick-reply-btn" onclick="document.getElementById('chat-input').value='When are the next elections?'; sendMessage();">Next Election?</button>
                <button class="quick-reply-btn" onclick="document.getElementById('chat-input').value='How do I register to vote?'; sendMessage();">How to Vote?</button>
                <button class="quick-reply-btn" onclick="document.getElementById('chat-input').value='Check my constituency'; sendMessage();">Constituency</button>
            </div>

            <div class="chat-input-container">
                <form id="chat-form">
                    <button type="button" id="mic-btn" class="icon-btn" style="background: var(--saffron); color: white;">🎙️</button>
                    <input type="text" id="chat-input" placeholder="Ask about elections..." autocomplete="off">
                    <button type="submit" id="send-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </form>
                <footer class="chat-footer">
                    Data is for informational purposes • <a href="https://voters.eci.gov.in/" target="_blank">Voter Portal</a>
                </footer>
            </div>
        </div>
    </div>

    <script>
// --- CHAT & UI EVENT LISTENERS ---
document.getElementById('chat-form').addEventListener('submit', function (e) {
    e.preventDefault();
    sendMessage();
});

// --- VOICE FEATURES (Male Voice + English Reading) ---
let availableVoices = [];
function loadVoices() {
    availableVoices = window.speechSynthesis.getVoices();
}
window.speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function speakKartikey(text) { 
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); 
        const cleanText = text.replace(/[*#]/g, ''); 
        const utterance = new SpeechSynthesisUtterance(cleanText);

        const preferredMaleVoices = [
            "Microsoft David", "Google US English Male", "Alex", "Google UK English Male", "Microsoft Mark"
        ];
        
        let kartikeyVoice = null;
        for (let name of preferredMaleVoices) {
            kartikeyVoice = availableVoices.find(v => v.name.includes(name));
            if (kartikeyVoice) break;
        }

        if (!kartikeyVoice) {
            kartikeyVoice = availableVoices.find(v => v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('man'));
        }
        
        if (kartikeyVoice) {
            utterance.voice = kartikeyVoice;
        }
        
        utterance.lang = 'en-IN'; 
        utterance.rate = 1.0; 
        utterance.pitch = 0.9; 
        
        window.speechSynthesis.speak(utterance);
    }
}

// --- MICROPHONE SETUP ---
const micBtn = document.getElementById('mic-btn');
const chatInput = document.getElementById('chat-input');
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition && micBtn) {
    const recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.lang = 'en-IN';
    recognition.interimResults = false;

    let isListening = false;

    micBtn.addEventListener('click', () => {
        if (isListening) {
            recognition.stop();
        } else {
            try {
                recognition.start();
            } catch (err) {
                console.error("Mic start error:", err);
            }
        }
    });

    recognition.onstart = () => {
        isListening = true;
        micBtn.innerHTML = '🔴';
        chatInput.placeholder = "Listening...";
    };

    recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        chatInput.value = transcript;
        sendMessage();
    };

    recognition.onerror = (event) => {
        console.error("Mic error:", event.error);
        if (event.error === 'not-allowed') {
            alert("Microphone permission denied.");
        }
    };

    recognition.onend = () => {
        isListening = false;
        micBtn.innerHTML = '🎙️';
        chatInput.placeholder = "Ask about elections...";
    };
} else if (micBtn) {
    micBtn.style.display = 'none'; 
}

// --- MESSAGE ELEMENT CREATION ---
function createMessageElement(isUser, content, useHTML=false) {
    const group = document.createElement('div');
    group.className = 'msg-group ' + (isUser ? 'user' : 'bot');

    const row = document.createElement('div');
    row.className = 'msg-row';

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = isUser ? 'Y' : 'K';
    row.appendChild(avatar);

    const msg = document.createElement('div');
    msg.className = 'message';
    if (useHTML) msg.innerHTML = content; else msg.textContent = content;
    row.appendChild(msg);

    const time = document.createElement('div');
    time.className = 'msg-time';
    const now = new Date();
    time.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    row.appendChild(time);

    group.appendChild(row);
    return group;
}

// --- CLEAR CHAT FUNCTION ---
function clearChat() {
    window.location.reload();
}
// --- MAIN CHAT LOGIC ---
async function sendMessage() {
    const input = document.getElementById('chat-input');
    const history = document.getElementById('chat-messages');
    const userText = input.value.trim();

    if (!userText) return;

    const userEl = createMessageElement(true, userText, false);
    history.appendChild(userEl);
    input.value = "";

    const loadingId = "loading-" + Date.now();
    const loadingGroup = document.createElement('div');
    loadingGroup.className = 'msg-group bot';
    loadingGroup.id = loadingId;
    const typingWrap = document.createElement('div');
    typingWrap.className = 'typing-indicator';
    typingWrap.innerHTML = '<span></span><span></span><span></span>';
    loadingGroup.appendChild(typingWrap);
    history.appendChild(loadingGroup);
    history.scrollTop = history.scrollHeight;

    try {
        const response = await fetch('/api/chat', {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                text: userText
            })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error || "API Error");
        if (!data.candidates || data.candidates.length === 0) throw new Error("No response from AI.");

        const aiReply = data.candidates[0].content.parts[0].text;
        const loadingEl = document.getElementById(loadingId);
        if (loadingEl) loadingEl.remove();

        const formattedReply = aiReply
            .trim()
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\n/g, '<br>');

        const botEl = createMessageElement(false, formattedReply, true);
        history.appendChild(botEl);
        history.scrollTop = history.scrollHeight;

        speakKartikey(aiReply); 

    } catch (error) {
        console.error(error);
        const loadingEl = document.getElementById(loadingId);
        if (loadingEl) {
            loadingEl.innerHTML = '';
            const err = document.createElement('div');
            err.className = 'message';
            err.style.color = 'red';
            err.style.borderColor = 'red';
            err.textContent = 'Error: ' + error.message;
            loadingEl.appendChild(err);
        }
    }
}
    </script>
</body>
</html>
